services:
  orion:
    build: .
    restart: unless-stopped
    volumes:
      - orion-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-proxy:/docker-proxy
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      - DOCKER_PROXY_DIR=/docker-proxy
      - DOCKER_PROXY_HOST_DIR=/opt/orion/docker-proxy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Bundled metasearch for the agent's web_search tool. Internal-only —
  # not published to the host, reachable from the orion container as
  # http://searxng:8080. No API keys, no external dependency.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  orion-data:
  caddy-data:
  caddy-config:
