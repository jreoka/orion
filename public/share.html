<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f0">
<title>Shared chat · Orion</title>
<style>
  :root {
    --paper: #faf7f0; --lift: #fffdf8; --ink: #1c1813; --ink-2: #57503f;
    --ink-3: #8d8474; --hairline: rgba(28,24,19,.13); --accent: #2e3fb8;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [data-theme="dark"] {
    color-scheme: dark;
    --paper: #171310; --lift: #1e1a14; --ink: #ece4d3; --ink-2: #b0a48c;
    --ink-3: #776d5b; --hairline: rgba(236,228,211,.14); --accent: #8b9bff;
  }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
  header { border-bottom: 1px solid var(--hairline); padding-bottom: 20px; margin-bottom: 28px; }
  .kicker { font-family: var(--sans); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
  h1 { font-size: 30px; line-height: 1.25; margin: 0 0 8px; font-weight: 600; }
  .meta { font-family: var(--sans); font-size: 13px; color: var(--ink-3); }
  .msg { display: flex; flex-direction: column; gap: 26px; }
  .m-user { align-self: flex-end; max-width: 88%; background: var(--ink); color: var(--paper);
    border-radius: 18px 18px 4px 18px; padding: 10px 16px; font-size: 16px; }
  .m-user p { margin: 0; }
  .m-user p + p { margin-top: .5em; }
  .m-assistant { font-size: 17.5px; line-height: 1.65; }
  .m-assistant h1, .m-assistant h2, .m-assistant h3 { line-height: 1.3; margin: 1.1em 0 .4em; }
  .m-assistant h1 { font-size: 24px; } .m-assistant h2 { font-size: 21px; } .m-assistant h3 { font-size: 18px; }
  .m-assistant p { margin: .7em 0; }
  .m-assistant ul, .m-assistant ol { margin: .7em 0; padding-left: 1.4em; }
  .m-assistant li { margin: .3em 0; }
  .m-assistant code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .86em;
    background: rgba(28,24,19,.06); padding: .1em .35em; border-radius: 5px; }
  .m-assistant pre { background: var(--lift); border: 1px solid var(--hairline); border-radius: 10px;
    padding: 14px 16px; overflow-x: auto; font-size: 14px; line-height: 1.55; }
  .m-assistant pre code { background: none; padding: 0; }
  .m-assistant a { color: var(--accent); }
  .m-assistant blockquote { border-left: 2px solid var(--hairline); margin: .8em 0; padding: .1em 0 .1em 1em; color: var(--ink-2); }
  .m-assistant .tbl-wrap { margin: .8em 0; overflow-x: auto; border: 1px solid var(--hairline); border-radius: 10px; }
  .m-assistant table { width: 100%; border-collapse: collapse; font-size: 15px; line-height: 1.5; font-family: var(--sans); }
  .m-assistant th, .m-assistant td { border-bottom: 1px solid var(--hairline); padding: 8px 12px;
    vertical-align: top; overflow-wrap: anywhere; text-align: left; }
  .m-assistant tbody tr:last-child td { border-bottom: 0; }
  .m-assistant thead th { font-family: var(--serif); font-weight: 700; background: rgba(28,24,19,.045);
    white-space: nowrap; }
  [data-theme="dark"] .m-assistant thead th { background: rgba(236,228,211,.06); }
  .m-assistant tbody tr:nth-child(even) td { background: rgba(46,63,184,.05); }
  [data-theme="dark"] .m-assistant tbody tr:nth-child(even) td { background: rgba(139,155,255,.06); }
  .m-assistant img.msg-img { max-width: 100%; border-radius: 12px; margin: .5em 0; display: block;
    cursor: zoom-in; }
  .m-user img.msg-img { max-width: 100%; border-radius: 8px; margin-top: .4em; display: block; cursor: zoom-in; }
  #lb { position: fixed; inset: 0; z-index: 100; background: rgba(10, 8, 6, .88);
    display: none; align-items: center; justify-content: center; cursor: zoom-out; padding: 24px; }
  #lb.open { display: flex; }
  #lb img { max-width: 100%; max-height: 100%; border-radius: 10px; object-fit: contain; }
  .chip { display: inline-block; font-family: var(--sans); font-size: 13.5px; color: var(--ink-2);
    border: 1px solid var(--hairline); border-radius: 999px; padding: 6px 14px; text-decoration: none; margin: .25em .35em .25em 0; }
  .err { text-align: center; padding: 80px 20px; color: var(--ink-2); }
  .err h1 { font-size: 22px; }
  footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--hairline);
    font-family: var(--sans); font-size: 12.5px; color: var(--ink-3); }
  #theme-toggle { position: fixed; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--hairline); background: var(--lift); color: var(--ink-2); cursor: pointer;
    display: flex; align-items: center; justify-content: center; z-index: 10; }
  #theme-toggle:hover { color: var(--ink); }
  #theme-toggle svg { width: 19px; height: 19px; }
  #theme-toggle .moon { display: none; }
  [data-theme="dark"] #theme-toggle .sun { display: none; }
  [data-theme="dark"] #theme-toggle .moon { display: block; }
</style>
<script>
  // Apply the saved theme before first paint so the page never flashes.
  (function () {
    try {
      var t = localStorage.getItem('orion-share-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) { /* private mode etc. — stay light */ }
  })();
</script>
</head>
<body>
<button id="theme-toggle" aria-label="Toggle dark mode">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
<div class="wrap" id="root"><div class="err"><p>Loading…</p></div></div>
<div id="lb" role="dialog" aria-label="Image viewer"><img alt=""></div>
<script src="/js/markdown.js"></script>
<script>
(function () {
  const token = location.pathname.split('/').pop();
  const root = document.getElementById('root');

  function isImageFile(name) { return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(name || ''); }

  function attachmentHtml(a) {
    return isImageFile(a.filename)
      ? `<img class="msg-img" src="${esc(a.url)}" alt="${esc(a.filename)}" loading="lazy">`
      : `<a class="chip" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">📎 ${esc(a.filename || 'file')}</a>`;
  }

  document.getElementById('theme-toggle').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('orion-share-theme', next); } catch (e) { /* ignore */ }
  });

  // Lightbox: tap any image to view it full-screen, tap or Esc to close.
  const lb = document.getElementById('lb');
  const lbImg = lb.querySelector('img');
  const closeLb = () => { lb.classList.remove('open'); lbImg.removeAttribute('src'); };
  root.addEventListener('click', (e) => {
    const img = e.target.closest('img.msg-img');
    if (!img) return;
    lbImg.src = img.currentSrc || img.src;
    lbImg.alt = img.alt || '';
    lb.classList.add('open');
  });
  lb.addEventListener('click', closeLb);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lb.classList.contains('open')) closeLb();
  });

  fetch('/api/share/' + encodeURIComponent(token))
    .then(async (r) => {
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Not found');
      return r.json();
    })
    .then((data) => {
      document.title = (data.title || 'Shared chat') + ' · Orion';
      const date = data.created_at
        ? new Date(data.created_at * 1000).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })
        : '';
      let html = `<header><div class="kicker">Shared chat</div><h1>${esc(data.title || 'Untitled chat')}</h1>` +
        (date ? `<div class="meta">Shared ${esc(date)}</div>` : '') + '</header><div class="msg">';
      for (const m of data.messages) {
        const hasText = m.content && String(m.content).trim().length > 0;
        const atts = m.attachments || [];
        // Tool-only turns (image sends, tool calls with no text) carry their
        // attachments here; turns with neither text nor attachments are noise.
        if (!hasText && !atts.length) continue;
        if (m.role === 'user') {
          html += `<div class="m-user">${md(m.content)}` + atts.map(attachmentHtml).join('') + '</div>';
        } else {
          html += '<div class="m-assistant">' + (hasText ? md(m.content) : '') +
            atts.map(attachmentHtml).join('') + '</div>';
        }
      }
      html += '</div><footer>Shared from Orion — read-only.</footer>';
      root.innerHTML = html;
      wireCopyButtons(root);
    })
    .catch((e) => {
      root.innerHTML = `<div class="err"><h1>This link doesn't work anymore.</h1>` +
        `<p>${esc(e.message || 'The chat may have been unshared or deleted.')}</p></div>`;
    });
})();
</script>
</body>
</html>
