<!DOCTYPE html>
<html lang="en" class="share-page">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f0">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%277%27%20fill%3D%27%23171310%27%2F%3E%3Ccircle%20cx%3D%279.5%27%20cy%3D%2721.5%27%20r%3D%272.7%27%20fill%3D%27%23beb7a8%27%2F%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2716%27%20r%3D%273.3%27%20fill%3D%27%236974bc%27%2F%3E%3Ccircle%20cx%3D%2722.5%27%20cy%3D%2710.5%27%20r%3D%272.7%27%20fill%3D%27%23beb7a8%27%2F%3E%3C%2Fsvg%3E">
<title>Shared chat · Orion</title>
<!-- The real app stylesheet: message layout, chips, work logs, lightbox and
     copy buttons all stay in sync with the main chat automatically. -->
<link rel="stylesheet" href="/css/app.css?v=294e85a">
<style>
  /* Share-page shell only — everything below is page chrome (header, footer,
     theme toggle, page scrolling). Message styling comes from app.css. */
  html.share-page, html.share-page body { height: auto; min-height: 100%; overflow: visible; }
  html.share-page body { display: block; }
  .share-head { max-width: 720px; margin: 0 auto; padding: 48px 26px 0; }
  .share-kicker { font-family: var(--sans); font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
  .share-title { font-size: 30px; line-height: 1.25; margin: 0 0 8px; font-weight: 600; }
  .share-meta { font-family: var(--sans); font-size: 13px; color: var(--ink-3); }
  .messages.share-list { overflow: visible; flex: none; padding-bottom: 8px; }
  .share-foot { max-width: 720px; margin: 56px auto 0; padding: 18px 26px 80px;
    border-top: 1px solid var(--hairline); font-family: var(--sans);
    font-size: 12.5px; color: var(--ink-3); }
  .share-err { text-align: center; padding: 80px 20px; color: var(--ink-2); }
  .share-err h1 { font-size: 22px; }
  /* Read-only page: the rx-copy button is the copy affordance. Suppress the
     native iOS long-press Copy bubble so it doesn't double up. */
  .share-page .msg { -webkit-touch-callout: none; }
  #share-theme { position: fixed; top: 14px; right: 14px; width: 40px; height: 40px;
    border-radius: 50%; border: 1px solid var(--hairline); background: var(--lift);
    color: var(--ink-2); cursor: pointer; display: flex; align-items: center;
    justify-content: center; z-index: 10; }
  #share-theme:hover { color: var(--ink); }
  #share-theme svg { width: 19px; height: 19px; }
  #share-theme .moon { display: none; }
  [data-theme="dark"] #share-theme .sun { display: none; }
  [data-theme="dark"] #share-theme .moon { display: block; }
</style>
<script>
  // Apply the saved theme before first paint so the page never flashes.
  (function () {
    try {
      var t = localStorage.getItem('orion-share-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) { /* private mode etc. — stay light */ }
  })();
</script>
</head>
<body>
<button id="share-theme" aria-label="Toggle dark mode">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
<div class="share-head" id="share-head" hidden>
  <div class="share-kicker">Shared chat</div>
  <h1 class="share-title" id="share-title"></h1>
  <div class="share-meta" id="share-meta"></div>
</div>
<div class="messages share-list" id="share-messages"></div>
<div class="share-foot" id="share-foot" hidden>Shared from Orion — read-only.</div>
<div id="toasts" aria-live="polite"></div>
<div id="lightbox" hidden>
  <img id="lightbox-img" alt="">
  <button id="lightbox-close" class="icon-btn" aria-label="Close">✕</button>
</div>
<script src="/js/markdown.js?v=f4f60e2"></script>
<script src="/js/render.js?v=294e85a"></script>
<script>
(function () {
  'use strict';
  var token = location.pathname.split('/').pop();
  var list = document.getElementById('share-messages');
  var byId = new Map();
  var SHARE_OPTS = { copyOnly: true }; // read-only: copy button only, no reply/react

  function toast(msg, kind) {
    var el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 300); }, 2600);
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand('copy'); ta.remove();
        return ok;
      } catch (e2) { return false; }
    }
  }

  function shareMessageEl(m) {
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
    wrap.dataset.mid = m.id || '';
    if (m.run_start) wrap.dataset.runStart = '1';
    wrap.innerHTML = m.role === 'user' ? userBubbleHtml(m, SHARE_OPTS) : assistantBodyHtml(m, SHARE_OPTS);
    return wrap;
  }

  // Lightbox — same structure as the main chat.
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lightbox-img');
  function closeLb() { lb.hidden = true; lbImg.removeAttribute('src'); }
  document.getElementById('lightbox-close').addEventListener('click', closeLb);
  lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !lb.hidden) closeLb(); });

  list.addEventListener('click', function (e) {
    var copyBtn = e.target.closest('[data-copy]');
    if (copyBtn) {
      // Mirror the main chat: copy the raw markdown source.
      var mid = copyBtn.closest('.msg') && copyBtn.closest('.msg').dataset.mid;
      var m = byId.get(String(mid));
      copyText(m ? m.content || '' : '').then(function (ok) {
        toast(ok ? 'Copied' : 'Copy failed', ok ? '' : 'error');
      });
      return;
    }
    var img = e.target.closest('.msg-img');
    if (img) {
      lbImg.src = img.currentSrc || img.src;
      lbImg.alt = img.alt || '';
      lb.hidden = false;
      return;
    }
    var quote = e.target.closest('[data-quote]');
    if (quote) {
      // Same jump + highlight ring as the main chat's jumpToMessage.
      var el = list.querySelector('.msg[data-mid="' + CSS.escape(String(quote.dataset.quote)) + '"]');
      if (!el) { toast('Original message is not loaded', 'error'); return; }
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.remove('quote-flash');
      void el.offsetWidth;
      el.classList.add('quote-flash');
    }
  });

  document.getElementById('share-theme').addEventListener('click', function () {
    var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('orion-share-theme', next); } catch (e) { /* ignore */ }
  });

  list.innerHTML = '<div class="share-err"><p>Loading…</p></div>';
  fetch('/api/share/' + encodeURIComponent(token))
    .then(function (r) {
      if (!r.ok) throw new Error('gone');
      return r.json();
    })
    .then(function (data) {
      document.title = (data.title || 'Shared chat') + ' · Orion';
      document.getElementById('share-title').textContent = data.title || 'Untitled chat';
      document.getElementById('share-meta').textContent = data.created_at
        ? 'Shared ' + new Date(data.created_at * 1000).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })
        : '';
      document.getElementById('share-head').hidden = false;
      document.getElementById('share-foot').hidden = false;
      list.innerHTML = '';
      var frag = document.createDocumentFragment();
      for (var m of data.messages) {
        var hasText = m.content && String(m.content).trim().length > 0;
        var atts = m.attachments || [];
        // Tool-only turns carry their attachments here; turns with neither
        // text nor attachments are noise.
        if (!hasText && !atts.length) continue;
        byId.set(String(m.id), m);
        frag.appendChild(shareMessageEl(m));
      }
      list.appendChild(frag);
      // Same work-log folding as the main chat. Snapshots are historical, so
      // every segment folds (no in-flight run to protect).
      for (var seg of splitRuns([...list.children])) foldRunSegment(seg, new Set());
    })
    .catch(function () {
      list.innerHTML = '<div class="share-err"><h1>This link doesn\'t work anymore.</h1>' +
        '<p>The chat may have been unshared or deleted.</p></div>';
    });
})();
</script>
</body>
</html>
